<!DOCTYPE html>
<html>
<head>
    <title>Download History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
</head>

<body class="p-4">

<h2>Your Download History</h2>

<table class="table mt-3 table-bordered">
    <thead>
        <tr>
            <th>#</th>
            <th>YouTube URL</th>
            <th>Download</th>
        </tr>
    </thead>
    <tbody>
        {% for item in history %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ item.url }}</td>
            <td><a href="/download/{{ item.id }}" class="btn btn-sm btn-success">Download</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="/" class="btn btn-link">← Back</a>

</body>
</html>
